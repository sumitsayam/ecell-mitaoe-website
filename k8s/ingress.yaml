apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecell-web-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  tls:
    - hosts:
        - ecell.mitaoe.ac.in
      secretName: ecell-tls-cert
  rules:
    - host: ecell.mitaoe.ac.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecell-web-service
                port:
                  number: 80

